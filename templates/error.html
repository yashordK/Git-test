<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oops, check students.json</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="error-box">
    <h1>🛠️ students.json has a typo</h1>
    <p>The site can't read your file. Git is fine, the JSON just needs fixing.</p>
    <pre>Line {{ error.lineno }}, column {{ error.colno }}: {{ error.msg }}</pre>
    <p class="hint">Common causes: a missing comma between two <code>{ }</code> blocks,
      a trailing comma after the last one, or a missing quote.</p>
  </main>
</body>
</html>
